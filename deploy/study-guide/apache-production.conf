# Add these directives inside the existing acupuncturetests.com TLS VirtualHost.
# Moodle remains the vhost DocumentRoot; only /study-guide/ is mapped here.

RedirectMatch 301 ^/study-guide$ /study-guide/
Alias /study-guide/ /var/www/acupuncturetests-study-guide/current/

<Directory /var/www/acupuncturetests-study-guide/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # The entry page is assembled into its final chapter view in the browser.
    # Always revalidate it so an older intermediate layout is never restored.
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Header always set Pragma "no-cache"
        Header always set Expires "0"
    </FilesMatch>
</Directory>
