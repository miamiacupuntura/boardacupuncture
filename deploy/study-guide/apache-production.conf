# Add these directives inside the existing acupuncturetests.com TLS VirtualHost.
# Moodle remains the vhost DocumentRoot; only /study-guide/ is mapped here.

RedirectMatch 301 ^/study-guide$ /study-guide/
Alias /study-guide/ /var/www/acupuncturetests-study-guide/current/

<Directory /var/www/acupuncturetests-study-guide/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
