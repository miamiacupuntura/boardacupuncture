<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Channel Systems — Relative Depth Review</title>
  <desc id="desc">Eight horizontal layers from Cutaneous Regions at the surface to deep Primary and Divergent pathways.</desc>
  <rect width="1200" height="820" fill="#f8fbfb"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#16364a">CHANNEL SYSTEMS — RELATIVE DEPTH REVIEW</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#526b76">Recreated study diagram based on Deadman’s superficial-to-deep sequence</text>
  <g font-family="Arial, sans-serif" fill="#17313f">
    <g transform="translate(70 125)"><rect width="1060" height="68" rx="14" fill="#d7f3ef" stroke="#5b9695"/><circle cx="42" cy="34" r="22" fill="#087774"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">1</text><text x="82" y="29" font-size="23" font-weight="700">Cutaneous Regions</text><text x="82" y="53" font-size="17">Broad skin territories — most superficial</text></g>
    <g transform="translate(95 205)"><rect width="1010" height="68" rx="14" fill="#c6ece7" stroke="#5b9695"/><circle cx="42" cy="34" r="22" fill="#087774"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">2</text><text x="82" y="29" font-size="23" font-weight="700">Minute Collaterals</text><text x="82" y="53" font-size="17">Progressively finer ramifications</text></g>
    <g transform="translate(120 285)"><rect width="960" height="68" rx="14" fill="#aee0da" stroke="#5b9695"/><circle cx="42" cy="34" r="22" fill="#087774"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">3</text><text x="82" y="29" font-size="23" font-weight="700">Sinew Channels</text><text x="82" y="53" font-size="17">Peripheral musculotendinous pathways</text></g>
    <g transform="translate(145 365)"><rect width="910" height="68" rx="14" fill="#91d1ca" stroke="#4a898c"/><circle cx="42" cy="34" r="22" fill="#087774"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">4</text><text x="82" y="29" font-size="23" font-weight="700">Luo-Connecting Channels</text><text x="82" y="53" font-size="17">Principal connecting collateral pathways</text></g>
    <g transform="translate(170 445)"><rect width="860" height="68" rx="14" fill="#73beb9" stroke="#407d84"/><circle cx="42" cy="34" r="22" fill="#075f60"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">5</text><text x="82" y="29" font-size="23" font-weight="700">Primary Channels</text><text x="82" y="53" font-size="17">Main organized twelve-channel network</text></g>
    <g transform="translate(195 525)"><rect width="810" height="68" rx="14" fill="#5b9fa8" stroke="#355f72"/><circle cx="42" cy="34" r="22" fill="#174e64"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">6</text><text x="82" y="29" font-size="23" font-weight="700" fill="white">Divergent Channels</text><text x="82" y="53" font-size="17" fill="white">Deeper paired connections and six confluences</text></g>
    <g transform="translate(220 605)"><rect width="760" height="68" rx="14" fill="#657f9e" stroke="#3f506c"/><circle cx="42" cy="34" r="22" fill="#394e70"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">7</text><text x="82" y="29" font-size="23" font-weight="700" fill="white">Extraordinary Vessels</text><text x="82" y="53" font-size="17" fill="white">Reservoir and regulatory network</text></g>
    <g transform="translate(245 685)"><rect width="710" height="68" rx="14" fill="#514f76" stroke="#33334d"/><circle cx="42" cy="34" r="22" fill="#302e50"/><text x="42" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="white">8</text><text x="82" y="29" font-size="21" font-weight="700" fill="white">Deep Primary &amp; Divergent pathways</text><text x="82" y="53" font-size="17" fill="white">Deepest entry in the source diagram</text></g>
  </g>
  <text x="1138" y="145" transform="rotate(90 1138 145)" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#d86620">SURFACE → DEEPER</text>
  <text x="600" y="792" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5d6f78">Conceptual review aid — not measured anatomical layers and not an original source figure</text>
</svg>
