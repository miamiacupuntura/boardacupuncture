<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Formula name distinction review"><title>Formula name review | AcupunctureTests</title><link rel="stylesheet" href="comparisons.css?v=20261026-2"><style>.formula-name-review__loading{margin:24px 0;padding:18px;border:1px solid #bfd8d3;border-radius:12px;background:#fff}.formula-name-review__footer{display:flex;justify-content:center;padding:20px}.formula-name-review__footer a{display:inline-flex;padding:10px 14px;border:1px solid #afc5d4;border-radius:8px;background:#fff;color:#0f4c81;font-weight:900;text-decoration:none}</style></head><body>
<header class="comparison-topbar"><div class="comparison-shell comparison-topbar__inner"><a class="comparison-brand" href="formula-name-traps.html"><span class="comparison-brand__mark" aria-hidden="true">☯</span><span>Formula name review</span></a><a class="comparison-back" data-quiz-return href="formula-name-traps.html">← Back to quiz</a></div></header>
<main class="comparison-shell" data-review-content><div class="formula-name-review__loading">Loading formula-name comparison…</div></main>
<div class="formula-name-review__footer"><a data-quiz-return href="formula-name-traps.html">← Back to quiz</a></div>
<script>
(() => {
  const params=new URLSearchParams(window.location.search),chapter=params.get('chapter')||'',requested=params.get('return')||'';
  let returnUrl='';try{const candidate=new URL(requested,window.location.href);if(candidate.origin===window.location.origin)returnUrl=candidate.toString();}catch(_){}
  const goBack=event=>{if(window.opener&&!window.opener.closed){event.preventDefault();const fallback=returnUrl||event.currentTarget.href;window.opener.focus();setTimeout(()=>{window.location.href=fallback;},250);window.close();}};
  document.querySelectorAll('[data-quiz-return]').forEach(link=>{if(returnUrl)link.href=returnUrl;link.addEventListener('click',goBack);});
  const target=document.querySelector('[data-review-content]');
  if(!/^[a-z0-9-]+-formula-trap(?:-es)?\.html$/.test(chapter)){target.innerHTML='<div class="formula-name-review__loading">This formula-name comparison could not be opened.</div>';return;}
  fetch(chapter,{credentials:'same-origin'}).then(response=>{if(!response.ok)throw new Error('load');return response.text();}).then(source=>{
    const doc=new DOMParser().parseFromString(source,'text/html'),article=doc.querySelector('article.study-note');
    if(!article)throw new Error('content');
    const navigation=article.querySelector('nav[aria-label="Chapter navigation"],nav[aria-label="Navegación de capítulos"]');if(navigation)navigation.remove();
    target.replaceChildren(document.importNode(article,true));const heading=target.querySelector('h1');if(heading)document.title=heading.textContent+' | AcupunctureTests';
  }).catch(()=>{target.innerHTML='<div class="formula-name-review__loading">This formula-name comparison could not be opened.</div>';});
})();
</script></body></html>
