<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Repaso de nombres engañosos de fórmulas"><title>Repaso de realidad clínica de fórmulas | AcupunctureTests</title><link rel="stylesheet" href="comparisons.css?v=20261026-2"><style>.misleading-review__loading{margin:24px 0;padding:18px;border:1px solid #bfd8d3;border-radius:12px;background:#fff}.misleading-review__footer{display:flex;justify-content:center;padding:20px}.misleading-review__footer a{display:inline-flex;padding:10px 14px;border:1px solid #afc5d4;border-radius:8px;background:#fff;color:#0f4c81;font-weight:900;text-decoration:none}</style></head><body>
<header class="comparison-topbar"><div class="comparison-shell comparison-topbar__inner"><a class="comparison-brand" href="misleading-formula-names-es.html"><span class="comparison-brand__mark" aria-hidden="true">☯</span><span>Realidad clínica de la fórmula</span></a><a class="comparison-back" data-quiz-return href="misleading-formula-names-es.html">← Regresar al quiz</a></div></header>
<main class="comparison-shell" data-review-content><div class="misleading-review__loading">Cargando fórmula y estrategia clínica…</div></main>
<div class="misleading-review__footer"><a data-quiz-return href="misleading-formula-names-es.html">← Regresar al quiz</a></div>
<script>
(() => {
  const params=new URLSearchParams(window.location.search),chapter=params.get('chapter')||'',requested=params.get('return')||'';
  let returnUrl='';try{const candidate=new URL(requested,window.location.href);if(candidate.origin===window.location.origin)returnUrl=candidate.toString();}catch(_){}
  const goBack=event=>{if(window.opener&&!window.opener.closed){event.preventDefault();const fallback=returnUrl||event.currentTarget.href;window.opener.focus();setTimeout(()=>{window.location.href=fallback;},250);window.close();}};
  document.querySelectorAll('[data-quiz-return]').forEach(link=>{if(returnUrl)link.href=returnUrl;link.addEventListener('click',goBack);});
  const target=document.querySelector('[data-review-content]');
  if(!/^[a-z0-9-]+-misleading-formula-name(?:-es)?\.html$/.test(chapter)){target.innerHTML='<div class="misleading-review__loading">No se pudo abrir esta fórmula.</div>';return;}
  fetch(chapter,{credentials:'same-origin'}).then(response=>{if(!response.ok)throw new Error('load');return response.text();}).then(source=>{
    const doc=new DOMParser().parseFromString(source,'text/html'),article=doc.querySelector('article.study-note');
    if(!article)throw new Error('content');
    const navigation=article.querySelector('nav[aria-label="Chapter navigation"],nav[aria-label="Navegación de capítulos"]');if(navigation)navigation.remove();
    target.replaceChildren(document.importNode(article,true));const heading=target.querySelector('h1');if(heading)document.title=heading.textContent+' | AcupunctureTests';
  }).catch(()=>{target.innerHTML='<div class="misleading-review__loading">No se pudo abrir esta fórmula.</div>';});
})();
</script></body></html>
