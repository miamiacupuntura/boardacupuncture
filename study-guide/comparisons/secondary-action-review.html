<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Secondary action review"><title>Secondary action review | AcupunctureTests</title><link rel="stylesheet" href="comparisons.css?v=20261026-2"><style>.secondary-review__loading{margin:24px 0;padding:18px;border:1px solid #bfd8d3;border-radius:12px;background:#fff}.secondary-review__footer{display:flex;justify-content:center;padding:20px}.secondary-review__footer a{display:inline-flex;padding:10px 14px;border:1px solid #afc5d4;border-radius:8px;background:#fff;color:#0f4c81;font-weight:900;text-decoration:none}</style></head><body>
<header class="comparison-topbar"><div class="comparison-shell comparison-topbar__inner"><a class="comparison-brand" href="secondary-actions.html"><span class="comparison-brand__mark" aria-hidden="true">☯</span><span>Secondary action review</span></a><a class="comparison-back" data-quiz-return href="secondary-actions.html">← Back to quiz</a></div></header>
<main class="comparison-shell" data-review-content><div class="secondary-review__loading">Loading study card…</div></main>
<div class="secondary-review__footer"><a data-quiz-return href="secondary-actions.html">← Back to quiz</a></div>
<script>
(() => {
  const params=new URLSearchParams(window.location.search);
  const chapter=params.get('chapter')||'';
  const requested=params.get('return')||'';
  let returnUrl='';
  try{const candidate=new URL(requested,window.location.href);if(candidate.origin===window.location.origin)returnUrl=candidate.toString();}catch(_){}
  const goBack=event=>{
    if(window.opener&&!window.opener.closed){
      event.preventDefault();const fallback=returnUrl||event.currentTarget.href;
      window.opener.focus();setTimeout(()=>{window.location.href=fallback;},250);window.close();
    }
  };
  document.querySelectorAll('[data-quiz-return]').forEach(link=>{if(returnUrl)link.href=returnUrl;link.addEventListener('click',goBack);});
  const target=document.querySelector('[data-review-content]');
  if(!/^secondary-actions-[0-9]{2}-[a-z0-9-]+(?:-es)?\.html$/.test(chapter)){
    target.innerHTML='<div class="secondary-review__loading">This study card could not be opened.</div>';return;
  }
  fetch(chapter,{credentials:'same-origin'}).then(response=>{if(!response.ok)throw new Error('load');return response.text();}).then(html=>{
    const doc=new DOMParser().parseFromString(html,'text/html'),article=doc.querySelector('article.study-note');
    if(!article)throw new Error('content');
    const navigation=article.querySelector('nav[aria-label="Chapter navigation"],nav[aria-label="Navegación de capítulos"]');if(navigation)navigation.remove();
    target.replaceChildren(document.importNode(article,true));
    const heading=target.querySelector('h1');if(heading)document.title=heading.textContent+' | AcupunctureTests';
  }).catch(()=>{target.innerHTML='<div class="secondary-review__loading">This study card could not be opened.</div>';});
})();
</script></body></html>
