<style>:root{--green:#087c69;--navy:#102a43;--line:#bfd8d3;--soft:#f4faf8;--blue:#2b63e8}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--navy);font:16px/1.45 Arial,sans-serif}.misc-practice{width:min(1040px,calc(100% - 24px));margin:24px auto 56px}.misc-practice__hero,.misc-practice__card{border:1px solid var(--line);border-radius:14px;background:#fff}.misc-practice__hero{padding:22px;border-top:5px solid var(--green)}.misc-practice__actions{display:flex;justify-content:flex-end;gap:9px}.misc-practice__actions a{padding:8px 12px;border:1px solid #afc5d4;border-radius:8px;color:#0f4c81;font-weight:800;text-decoration:none}.misc-practice__eyebrow,.misc-practice__label{color:var(--green);font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}h1{margin:5px 0 8px;font-size:clamp(30px,5vw,44px)}.misc-practice__card{margin-top:16px;padding:22px}.misc-practice__resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.misc-practice__resource{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:68px;padding:12px;border:1px solid #c6d5df;border-radius:9px;background:#f8fafc;color:var(--navy);text-align:left;cursor:pointer}.misc-practice__resource:hover{border-color:var(--blue);background:#eef4ff}.misc-practice__resource strong,.misc-practice__resource span{display:block}.misc-practice__resource span{margin-top:3px;color:#5d7388;font-size:12px}.misc-practice__status{padding:10px 12px;border-radius:8px;background:var(--soft);font-weight:700}.misc-practice__status.is-error{background:#fff0ed;color:#a33}label{display:grid;gap:6px;font-weight:800}select{width:min(240px,100%);height:42px;padding:7px 10px;border:1px solid #9db8c8;border-radius:8px;background:#fff}button{font:inherit;font-weight:900}.misc-practice__primary,.misc-practice__next{border:0;border-radius:9px;background:var(--green);color:#fff;cursor:pointer}.misc-practice__primary{margin-top:14px;padding:10px 16px}.misc-practice__primary:disabled{opacity:.5}.misc-practice__meta{display:flex;justify-content:space-between;font-weight:900}.misc-practice__track{height:8px;margin:12px 0 20px;border-radius:999px;background:#e5edf1;overflow:hidden}.misc-practice__bar{height:100%;width:0;background:var(--green)}.misc-practice__context{padding:14px;border-left:4px solid var(--green);background:var(--soft);font-size:18px;font-weight:700}.misc-practice__options{display:grid;gap:10px;margin-top:18px}.misc-practice__option{width:100%;padding:13px 15px;border:1px solid #c6d5df;border-radius:9px;background:#f8fafc;color:var(--navy);text-align:left;cursor:pointer}.misc-practice__option.is-correct{border-color:#16834d;background:#eaf8f0}.misc-practice__option.is-incorrect{border-color:#c2413b;background:#fff0ed}.misc-practice__feedback{margin-top:16px;padding:13px;border-radius:8px;font-weight:800}.misc-practice__feedback.is-correct{background:#eaf8f0;color:#11643d}.misc-practice__feedback.is-incorrect{background:#fff0ed;color:#9f2f2a}.misc-practice__next{display:block;margin:16px 0 0 auto;padding:10px 18px;background:var(--blue)}.misc-practice__score{font-size:32px;font-weight:900;color:var(--green)}[hidden]{display:none!important}@media(max-width:650px){.misc-practice__resources{grid-template-columns:1fr}.misc-practice__hero,.misc-practice__card{padding:16px}.misc-practice__actions{justify-content:flex-start;flex-wrap:wrap}}</style></head><body>
