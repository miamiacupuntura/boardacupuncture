<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Herbal combination review"><title>Herbal combination review | AcupunctureTests</title><link rel="stylesheet" href="comparisons.css?v=20261026-2"><style>.combination-review__loading{margin:24px 0;padding:18px;border:1px solid #bfd8d3;border-radius:12px;background:#fff}.combination-review__footer{display:flex;justify-content:center;padding:20px}.combination-review__footer a{display:inline-flex;padding:10px 14px;border:1px solid #afc5d4;border-radius:8px;background:#fff;color:#0f4c81;font-weight:900;text-decoration:none}</style></head><body>
<header class="comparison-topbar"><div class="comparison-shell comparison-topbar__inner"><a class="comparison-brand" href="/blocks/myprogress/common-herbal-combinations.php"><span class="comparison-brand__mark" aria-hidden="true">☯</span><span>Herbal combination review</span></a><a class="comparison-back" data-quiz-return href="miscellaneous-practice.html?source=combinations">← Back to quiz</a></div></header>
<main class="comparison-shell" data-review-content><div class="combination-review__loading">Loading combinations and herb roles…</div></main>
<div class="combination-review__footer"><a data-quiz-return href="miscellaneous-practice.html?source=combinations">← Back to quiz</a></div>
<script>
(() => {
  const params=new URLSearchParams(window.location.search),requestedChapter=params.get('chapter')||'',requestedReturn=params.get('return')||'';
  let returnUrl='';try{const candidate=new URL(requestedReturn,window.location.href);if(candidate.origin===window.location.origin)returnUrl=candidate.toString();}catch(_){}
  const goBack=event=>{if(window.opener&&!window.opener.closed){event.preventDefault();const fallback=returnUrl||event.currentTarget.href;window.opener.focus();setTimeout(()=>{window.location.href=fallback;},250);window.close();}};
  document.querySelectorAll('[data-quiz-return]').forEach(link=>{if(returnUrl)link.href=returnUrl;link.addEventListener('click',goBack);});
  const target=document.querySelector('[data-review-content]');let chapter;
  try{chapter=new URL(requestedChapter,window.location.href);}catch(_){}
  if(!chapter||chapter.origin!==window.location.origin||chapter.pathname!=='/blocks/myprogress/common-herbal-combinations.php'||!/^#combination-group-[0-9]+$/.test(chapter.hash)){target.innerHTML='<div class="combination-review__loading">This combination group could not be opened.</div>';return;}
  fetch(chapter.pathname+chapter.search,{credentials:'same-origin'}).then(response=>{if(!response.ok)throw new Error('load');return response.text();}).then(source=>{
    const doc=new DOMParser().parseFromString(source,'text/html'),section=doc.querySelector(chapter.hash);
    if(!section)throw new Error('content');
    doc.querySelectorAll('style').forEach(style=>document.head.append(document.importNode(style,true)));
    target.replaceChildren(document.importNode(section,true));const heading=target.querySelector('h2');if(heading)document.title=heading.textContent+' | AcupunctureTests';
  }).catch(()=>{target.innerHTML='<div class="combination-review__loading">This combination group could not be opened.</div>';});
})();
</script></body></html>
